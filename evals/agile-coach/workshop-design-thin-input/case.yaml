schema_version: "1.1"
name: workshop-design-thin-input
description: A request for a workshop with no purpose, size or length. Expect questions about purpose and outcomes before a full agenda.
tags: [agile-coach, workshop-design, thin-input]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Can you design a workshop for my team next week?
graders:
  - name: asks-purpose-first
    type: llm
    criteria: |
      PASS if the reply asks about details such as the purpose or desired outcomes, who is coming, how long, and whether it is in person or remote, or gives a skeleton with the purpose marked [TBC] and its assumptions listed.
      FAIL if the reply invents a purpose or topic (for example assumes it is a retro or a planning session) and presents a finished agenda for it without saying it is an assumption.
