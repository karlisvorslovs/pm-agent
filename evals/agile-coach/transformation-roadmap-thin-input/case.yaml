schema_version: "1.1"
name: transformation-roadmap-thin-input
description: A vague wish to "go agile" across the company. Expect questions about the problem, scope and sponsor, or a draft with a discovery phase and [TBC] baselines.
tags: [agile-coach, transformation-roadmap, thin-input]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    We want to go agile across the company. Can you put together a roadmap?
graders:
  - name: asks-about-the-problem
    type: llm
    criteria: |
      PASS if the reply asks what problem the change should solve, or about scope, sponsor, what has been tried or what data exists, or drafts a roadmap whose problem and baselines are marked [TBC] and whose first phase is discovery.
      FAIL if the reply invents baseline numbers (such as lead times, team counts or release frequency), or prescribes rolling out one named framework across the whole company.
