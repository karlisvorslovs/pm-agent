schema_version: "1.1"
name: sprint-metrics-thin-input
description: A question about velocity for management with no data. Expect a request for the sprint data, not invented numbers or charts.
tags: [scrum-master, sprint-metrics, thin-input]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    How's our velocity looking? Management wants to know.
graders:
  - name: asks-before-inventing
    type: llm
    criteria: |
      PASS if the reply asks for the sprint data (such as points forecast and completed per sprint, how many sprints, or an export) and does not present any velocity figures. Mentioning that velocity shouldn't be used as a target or to compare teams is fine.
      FAIL if the reply invents velocity numbers, trends, sprint names or a chart.
