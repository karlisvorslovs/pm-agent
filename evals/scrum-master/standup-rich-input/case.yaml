schema_version: "1.1"
name: standup-rich-input
description: Daily Scrum notes with an ageing blocker, a PR waiting for review, off-goal work and a long debate. Expect goal status first, an aged blocker marked for escalation, and follow-ups.
tags: [scrum-master, standup]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Notes from today's standup, Thu 12 Nov 2026. Sprint runs Mon 9 to Fri 20 Nov, goal is "clinic staff can book a follow-up appointment from the patient record".
    - Anna: calendar API still returns 500 on staging, she pinged the platform team on Monday, no answer yet
    - Peteris: booking form is finished, PR open since yesterday, needs a reviewer
    - Liam: started the SMS reminder story, not part of the goal but he had nothing else to pick up
    - Chloe and Liam spent 15 min debating how to store time zones, didn't finish
    - Chloe: can't test the booking flow end to end until the API works
    Can you write this up and tell me what needs chasing?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?standup"'
  - name: blocker-age-column
    type: regex
    pattern: '\|\s*Age\b'
    flags: i
  - name: goal-blocker-and-follow-ups
    type: llm
    criteria: |
      PASS if all of these hold: the Sprint Goal and its status come first and the status is at risk (or off track); the calendar API 500 is a blocker raised Mon 9 Nov 2026, aged 3 working days, with an escalation or chase step; Peteris's PR is flagged as needing a reviewer before new work starts; the SMS reminder work is noted as not serving the Sprint Goal; and the time zone debate becomes a follow-up rather than minutes.
      FAIL if the goal is marked on track, if any blocker or follow-up is assigned to a named person who is not in the notes, or if the reply invents items, ticket IDs or dates presented as facts.
