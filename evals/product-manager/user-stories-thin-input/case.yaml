schema_version: "1.1"
name: user-stories-thin-input
description: A request for stories about an undefined notifications feature. Expect specific questions, not invented triggers, channels or rules.
tags: [product-manager, user-stories, thin-input]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Need user stories for the new notifications feature, sprint planning is tomorrow.
graders:
  - name: asks-before-inventing
    type: llm
    criteria: |
      PASS if the reply asks at least two specific questions before writing final stories, such as who gets notified, which events trigger a notification, which channels (email, push, in-app) and what is out of scope, or gives a clearly provisional draft where every business rule is marked [TBC].
      FAIL if the reply presents finished stories with specific triggers, channels, limits or timings the user never gave without marking them [TBC], or assigns story points.
