schema_version: "1.1"
name: roadmap-dates-asked
description: The board wants dates, and one item has a fixed regulatory deadline. Expect date ranges with confidence, the fixed date marked as fixed, and no exact day for later items.
tags: [product-manager, roadmap, edge-case]
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Board meeting on Thu 19 Nov and they want to know when things land on the Shiftwise roadmap.
    Now: coverage alerts (in build, design done).
    Next: payroll export rework (problem validated in churn interviews, solution not designed yet).
    Later: native staff app (one customer asking).
    Also the new working time regulation reporting has to be live by Wed 31 Mar 2027, that date is fixed.
    Can you give me the roadmap with timing?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?roadmap"'
  - name: marks-fixed-date
    type: regex
    pattern: '\bfixed\b'
    flags: i
  - name: ranges-with-confidence
    type: llm
    criteria: |
      PASS if the reply gives timing as ranges (a month or a quarter, not a single day) with a confidence level for each item (for the item already in build, a suggested month marked for the team to confirm, or an explicit [TBC] with the team asked to confirm a month before the board, also counts; for the fixed regulatory date, a delivery-risk note or [TBC] counts as its confidence), shows Wed 31 Mar 2027 as a fixed date for the regulatory reporting, gives the native staff app either no date or a broad half-year or later window with low confidence, and gives payroll export a window no narrower than a quarter.
      FAIL if any roadmap item other than the regulatory deadline gets a single exact delivery day (dates for reviews or meetings are fine), if confidence levels are missing, or if the native staff app gets a specific month.
