schema_version: "1.1"
name: decision-log-thin-input
description: A vague request with no decision content. Expect questions, not an invented entry.
tags: [shared, decision-log, thin-input]
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Add the vendor decision to the decision log.
graders:
  - name: asks-before-inventing
    type: llm
    criteria: |
      PASS if the reply asks what was decided, who decided it, or what the options were, and does not write a finished entry that names a specific vendor, decider or date.
      FAIL if the reply invents a vendor, a decider, a date or a rationale.
