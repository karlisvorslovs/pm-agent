schema_version: "1.1"
name: role-unknown-name
description: An unknown role name saves nothing and shows the options.
tags: [shared, role]
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: /role designer
graders:
  - name: not-recognised
    type: llm
    criteria: |
      PASS if the reply says "designer" is not a recognised role and shows the available roles (project manager, product manager, agile coach, scrum master).
      FAIL if the reply claims a role was set.
  - name: nothing-saved
    type: file_exists
    path: '.claude/pm-agent.local.md'
    exists: false
