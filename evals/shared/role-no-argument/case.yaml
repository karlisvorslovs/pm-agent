schema_version: "1.1"
name: role-no-argument
description: With no argument, /role says no role is set and lists all four roles.
tags: [shared, role]
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: /role
graders:
  - name: lists-all-roles
    type: regex
    pattern: '/role pm[\s\S]*/role product[\s\S]*/role agile-coach[\s\S]*/role scrum-master'
  - name: says-none-set
    type: regex
    pattern: 'no role'
    flags: i
